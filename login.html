<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会員ログイン — 元八王子東小学校 おやじの会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Shippori+Antique+B1&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Yomogi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <span class="eyebrow">MEMBER LOGIN</span>
    <h1 class="brush">会員ログイン</h1>
    <p>Googleアカウント、またはメールアドレスでログイン・新規登録できます。初めての方は自動的に会員登録され、管理者の承認をお待ちいただきます。</p>
  </div>
</section>

<section class="section-narrow">
  <div class="wrap" style="max-width:480px;">
    <div class="form-card narrow" id="loginCard">
      <div id="loginMessage"></div>

      <div id="loggedOutView">
        <div class="tab-buttons" id="authTabs" style="margin-bottom:22px;">
          <button type="button" class="active" data-tab="login">ログイン</button>
          <button type="button" data-tab="register">新規登録</button>
        </div>

        <div id="loginTab">
          <button id="googleLoginBtn" type="button" class="btn btn-primary btn-block">
            Googleでログイン
          </button>
          <div class="or-divider">または</div>
          <div id="emailLoginMsg"></div>
          <form id="emailLoginForm">
            <div class="field">
              <label for="loginEmail">メールアドレス</label>
              <input id="loginEmail" type="email" required>
            </div>
            <div class="field">
              <label for="loginPassword">パスワード</label>
              <input id="loginPassword" type="password" required>
            </div>
            <button type="submit" class="btn btn-dark btn-block">メールでログイン</button>
          </form>
          <p style="text-align:center; margin-top:14px;">
            <a href="#" id="forgotPasswordLink" style="font-size:13px; color:var(--red); font-weight:700;">パスワードをお忘れですか？</a>
          </p>
        </div>

        <div id="registerTab" style="display:none;">
          <button id="googleRegisterBtn" type="button" class="btn btn-primary btn-block">
            Googleで登録
          </button>
          <div class="or-divider">または</div>
          <div id="emailRegisterMsg"></div>
          <form id="emailRegisterForm">
            <div class="field">
              <label for="regName">お名前（ニックネーム）</label>
              <input id="regName" type="text" required maxlength="40">
            </div>
            <div class="field">
              <label for="regEmail">メールアドレス</label>
              <input id="regEmail" type="email" required>
            </div>
            <div class="field">
              <label for="regPassword">パスワード（6文字以上）</label>
              <input id="regPassword" type="password" required minlength="6">
            </div>
            <div class="field">
              <label for="regPasswordConfirm">パスワード（確認用）</label>
              <input id="regPasswordConfirm" type="password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-dark btn-block">登録する</button>
          </form>
        </div>

        <p class="field hint" style="margin-top:16px; text-align:center;">
          ログインすることで、おやじの会の会員向けサービス（マイページ・ブログ投稿・会員一覧の閲覧）が利用できます。
        </p>
      </div>

      <div id="loggedInView" style="display:none;"></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script type="module" src="assets/js/login.js"></script>
</body>
</html>
