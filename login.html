<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会員ログイン — 元八王子東小学校 おやじの会</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Shippori+Antique+B1&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Yomogi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <span class="eyebrow">MEMBER LOGIN</span>
    <h1 class="brush">会員ログイン</h1>
    <p>Googleアカウントでログインしてください。初めての方は自動的に会員登録され、管理者の承認をお待ちいただきます。</p>
  </div>
</section>

<section class="section-narrow">
  <div class="wrap" style="max-width:480px;">
    <div class="form-card narrow" id="loginCard">
      <div id="loginMessage"></div>
      <div id="loggedOutView">
        <button id="googleLoginBtn" type="button" class="btn btn-primary btn-block">
          Googleでログイン / 新規登録
        </button>
        <p class="field hint" style="margin-top:16px; text-align:center;">
          ログインすることで、おやじの会の会員向けサービス（マイページ・ブログ投稿・会員一覧の閲覧）が利用できます。
        </p>
      </div>
      <div id="loggedInView" style="display:none;"></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script type="module" src="assets/js/login.js"></script>
</body>
</html>
